---
services:
  db:
    image: neha7284/flm02:db
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - myapp

  auth_service:
    image: neha7284/flm02:authimage
    deploy:
      replicas: 1
    ports:
      - "5001:5001"
    networks:
      - myapp
   

  book_service:
    image: neha7284/flm02:bookimage
    deploy:
      replicas: 1
    ports:
      - "5002:5002"
    networks:
      - myapp
   
      
  borrow_service:
    image: neha7284/flm02:borrowimage
    deploy:
      replicas: 1
    ports:
      - "5003:5003"
    networks:
      - myapp
   

  frontend:
    image: neha7284/flm02:frontendimage
    deploy:
      replicas: 1
    ports:
      - "5000:5000"
    networks:
      - myapp
   

networks:
  myapp:
    driver: overlay
